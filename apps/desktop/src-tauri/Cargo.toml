[package]
name = "qrtz-desktop"
description = "qrtz desktop app, Tauri 2 shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "qrtz-app"

# ADR 0162: the app's executable is Contents/MacOS/qrtz-app; Contents/MacOS/qrtz is the `qrtz` command (externalBin).
# Same bundle (qrtz.app), same identifier (ai.qrtz.desktop): the designated requirement and the TCC identity are unchanged.
[[bin]]
name = "qrtz-app"
path = "src/main.rs"

[lib]
name = "qrtz_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qrtz-app = { workspace = true, features = ["runtime"] }
qrtz-ipc = { workspace = true }
qrtz-helper-bridge = { workspace = true }
# ADR 0083: "show logs" spawns Finder under the N98 fork guard.
qrtz-cloexec = { workspace = true }
qrtz-storage = { workspace = true }
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# `tauri build` turns this on: serve the bundled ../dist over tauri:// instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
