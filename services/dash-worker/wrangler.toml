# Agent Dash server (ADR 0228 amendment). NOT DEPLOYED: Bozniak's dash findings 1-3 must be cleared first.
# Check the build with `bunx wrangler deploy --dry-run --outdir dist`. Deploy steps are in the ADR.
name = "qrtz-dash"
main = "src/index.ts"
compatibility_date = "2026-10-19"
workers_dev = false
preview_urls = false

# The custom domain. Prepared only: nothing is applied until `wrangler deploy` (which also creates the DNS record
# for dash.qrtz.ai in the qrtz.ai zone).
routes = [{ pattern = "dash.qrtz.ai", custom_domain = true }]

[[durable_objects.bindings]]
name = "DASHBOARD"
class_name = "Dashboard"

[[durable_objects.bindings]]
name = "ENROLL"
class_name = "EnrollDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Dashboard", "EnrollDirectory"]

# QRT-307 (Bozniak ruling 6): Workers Logs is on, but the only thing logged is the Worker's own line per request,
# {"method","route","status","ms"} with the route template (e.g. /v1/widgets/:key), from src/reqlog.ts. Cloudflare's
# automatic invocation logs (which carry the request URL and headers) are off, traces are off, and query strings
# are redacted as a backstop. Every request is sampled. test/api.test.ts checks this block, and there is no [env.*]
# section, so this is also the prod config.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

[observability.traces]
enabled = false

# Secrets (never in this file): DASH_PEPPER (64 hex), DASH_ENROLL_KEY (64 hex, QRT-284: keys only the enrollment-code
# HMAC) and DASH_SETUP_TOKEN, set with `wrangler secret put`.
