# CI for qrtz (docs/ci.md). QRT-310: on push and pull_request only the Linux jobs run (lint, typecheck, vitest,
# playwright, fmt, clippy, cargo test). The macOS jobs run only for releases: a tag push, release.yml calling this
# workflow (workflow_call, macos: true), or a manual run with the macos input. With macOS, Linux and macOS both
# run the full test suite, and macOS also builds an UNSIGNED release qrtz.app/.dmg and runs the parts of
# scripts/release/verify-bundle.sh that don't need a Developer ID signature. No workflow here uses any secret;
# signing, notarizing and publishing stay on Jared's Mac (bun run release:mac, scripts/app/publish-local.sh).
name: ci

on:
  push:
    branches: [main]
    tags: ['app-v*', 'nano-v*', 'ctrl-v*', 'snap-v*', 'v*']
  # Public repo: outside PRs get CI too. pull_request (never pull_request_target): no secrets, read-only token.
  pull_request:
  # QRT-310 follow-up: nightly full run (Linux + macOS) on main, ~3 AM PT (10:00 UTC). Schedules run on the default branch.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the macOS jobs (swift/cargo tests, KeychainStore, echo warm-up, unsigned release build + verify-bundle)
        type: boolean
        default: false
  # release.yml runs the whole suite, macOS included, before it builds.
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: true

# QRT-310: one run per workflow and ref. A newer run on a branch, tag or PR cancels the older one; main's runs are
# never cancelled (each landed hash keeps its own result). A caller (release.yml) must not use this same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  js:
    name: lint · typecheck · vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # QRT-322: setup script verifies the release environment before any secret upload (gh stubbed, no network).
      - run: bash scripts/setup/jared-setup-once.test.sh

  e2e:
    name: playwright (renderer, mocked backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QRTZ_TAURI_E2E_PORT: 1420
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: install browser system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: bun run e2e
        working-directory: apps/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rust:
    name: fmt · clippy · cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: system deps (Tauri / WebKitGTK)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libdbus-1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # tauri::generate_context! needs apps/desktop/dist (frontendDist).
      - name: renderer build
        run: bun --bun run --cwd apps/desktop build
      - run: cargo fmt --all --check
      - name: clippy (as check:rust)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Bozniak call 2: the dash helper's fail-closed and no-override tests must pass in a release build too.
      - name: qrtz-dash-net release tests (fail closed, no dev override)
        run: cargo test -p qrtz-dash-net --release --test fail_closed --test dev_origin

  macos:
    name: macOS · swift test · cargo test · cargo check desktop
    # QRT-310: macOS only for releases (tag, release.yml), the nightly schedule, or a manual run with the macos input.
    if: inputs.macos == true || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/qrtz-helper/.build
          key: swiftpm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('native/qrtz-helper/Package.swift', 'native/qrtz-helper/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.event.repository.name }}-
      - name: swift test (helper)
        run: |
          swift --version
          bun run test:helper
      # QRT-299: a release helper (no QRTZ_DIAG) refuses --bench / --echo-bench / --echo-warmup and carries none of them.
      - name: release helper refuses the diagnostic flags (QRT-299)
        run: native/qrtz-helper/scripts/release-flags-check.sh
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: renderer build
        run: bun --bun run --cwd apps/desktop build
      # externalBin (tauri.macos.conf.json) must exist for the build script; a stub is enough for a check.
      - name: sidecar stub
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          printf '#!/bin/sh\nexit 1\n' > apps/desktop/src-tauri/binaries/qrtz-helper-aarch64-apple-darwin
          chmod +x apps/desktop/src-tauri/binaries/qrtz-helper-aarch64-apple-darwin
      - run: cargo check -p qrtz-desktop --all-targets
      - name: cargo test (workspace)
        run: cargo test --workspace
      # macOS ships /bin/bash 3.2; run the dash-worker e2e under it so bash-3.2 parsing bugs fail CI.
      - name: dash-worker e2e under /bin/bash 3.2
        working-directory: services/dash-worker
        run: |
          major=$(node --version | sed 's/^v//;s/\..*//'); [ "$major" -ge 22 ] || { echo "::error::Node >= 22 required for wrangler, found $(node --version)"; exit 1; }
          /bin/bash --version | head -n1
          /bin/bash scripts/e2e.sh

  # QRT-270: echo's warm-up race, scripted (no mic, no Accessibility, no key). Everything it runs lives in
  # native/qrtz-helper (scripts/echo-warmup-ci.sh); the model is fetched from its pinned revision and sha256s.
  echo-warmup:
    name: macOS · echo warm-up race (QRT-270)
    # QRT-310: macOS only for releases (tag, release.yml), the nightly schedule, or a manual run with the macos input.
    if: inputs.macos == true || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/echo-warmup/models
          key: echo-asr-${{ hashFiles('crates/qrtz-app/src/local_models.json') }}
      - run: native/qrtz-helper/scripts/echo-warmup-ci.sh

  # QRT-276 (Bozniak-cleared): KeychainStore type-check (debug and release paths) and the real-keychain tests that
  # gate QRT-260, on a THROWAWAY keychain made in this job and always deleted at the end. The login keychain is never
  # read or written: only the throwaway one is on the search list while the tests run. Only test-generated values
  # are stored, no repo secret is used, and the token stays contents: read.
  keychain:
    name: macOS · KeychainStore (throwaway keychain)
    # QRT-310: macOS only for releases (tag, release.yml), the nightly schedule, or a manual run with the macos input.
    if: inputs.macos == true || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-keychain
      - name: type-check KeychainStore (debug and release cfg)
        run: |
          cargo check -p qrtz-dash-net --all-targets
          cargo check -p qrtz-dash-net --all-targets --release
      - name: build tests
        run: cargo test -p qrtz-dash-net --test real_keychain --no-run
      - name: create throwaway keychain
        run: |
          kc="$RUNNER_TEMP/qrtz-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db"
          pw="$(uuidgen)"   # test-generated, lives only in this job
          echo "QRTZ_TEST_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security list-keychains -d user > "$RUNNER_TEMP/kc-list.orig"
          security default-keychain -d user > "$RUNNER_TEMP/kc-default.orig"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          security default-keychain -d user
      - name: real keychain tests
        run: cargo test -p qrtz-dash-net --test real_keychain -- --ignored --test-threads=1
      - name: delete throwaway keychain
        if: always()
        run: |
          [[ -n "${QRTZ_TEST_KEYCHAIN:-}" ]] || exit 0
          if [[ -s "$RUNNER_TEMP/kc-default.orig" ]]; then
            security default-keychain -d user -s "$(tr -d ' "' < "$RUNNER_TEMP/kc-default.orig")" || true
          fi
          if [[ -s "$RUNNER_TEMP/kc-list.orig" ]]; then
            xargs security list-keychains -d user -s < "$RUNNER_TEMP/kc-list.orig" || true
          fi
          security delete-keychain "$QRTZ_TEST_KEYCHAIN" || true
          [[ ! -e "$QRTZ_TEST_KEYCHAIN" ]]

  # Unsigned release build on macOS. Named "release", so no restored caches: always a cold, reproducible build.
  release-unsigned:
    name: macOS · unsigned release build · verify-bundle (no Developer ID)
    # QRT-310: macOS only for releases (tag, release.yml), the nightly schedule, or a manual run with the macos input.
    if: inputs.macos == true || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SWIFT_BUILD_FLAGS: --disable-keychain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - run: bun install --frozen-lockfile
      # Same build release:mac does (bun run make), with no signing identity and no notarization variables.
      - name: tauri build (unsigned)
        run: |
          env -u APPLE_SIGNING_IDENTITY -u APPLE_CERTIFICATE -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID \
            -u APPLE_API_KEY -u APPLE_API_ISSUER -u APPLE_API_KEY_PATH bun run --cwd apps/desktop make
      - name: locate bundle
        id: bundle
        run: |
          app="$(find target apps/desktop/src-tauri/target -path '*/release/bundle/macos/qrtz.app' -maxdepth 5 -type d 2>/dev/null | head -n1)"
          [ -n "$app" ] || { echo "no qrtz.app built" >&2; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$(dirname "$app")")" >> "$GITHUB_OUTPUT"
      # QRT-255: a helper signed with the wrong identifier (0.2.4's qrtz-echo) fails the check sign-mac.sh and
      # verify-bundle.sh share. Ad-hoc signed, test-only requirement, no secret.
      - name: bundled helper identifier negative test
        run: bash scripts/release/bundled-helpers.test.sh
      # Ad-hoc sign (no identity, no secret) with the identifiers and entitlements sign-mac.sh uses, so verify-bundle's
      # identifier and entitlement checks test the real layout. Ad-hoc can never pass the Developer ID checks.
      - name: ad-hoc sign like sign-mac.sh
        run: |
          app="${{ steps.bundle.outputs.app }}"
          codesign --force --options runtime --identifier ai.qrtz.cli --sign - "$app/Contents/MacOS/qrtz"
          codesign --force --options runtime --identifier ai.qrtz.echo \
            --entitlements native/qrtz-helper/entitlements/ai.qrtz.echo.entitlements --sign - "$app/Contents/MacOS/qrtz-echo"
          # ADR 0237: nano (microphone + calendars), ctrl and snap (no entitlements) are bundled like echo.
          codesign --force --options runtime --identifier ai.qrtz.nano \
            --entitlements native/qrtz-helper/entitlements/ai.qrtz.nano.entitlements --sign - "$app/Contents/MacOS/qrtz-nano"
          codesign --force --options runtime --identifier ai.qrtz.ctrl --sign - "$app/Contents/MacOS/qrtz-ctrl"
          codesign --force --options runtime --identifier ai.qrtz.snap --sign - "$app/Contents/MacOS/qrtz-snap"
          codesign --force --options runtime --identifier ai.qrtz.desktop \
            --entitlements apps/desktop/src-tauri/entitlements.mac.plist --sign - "$app"
      # verify-bundle.sh is unchanged and runs in full. Only the FAILs that need a Developer ID signature, notarization
      # or a stapled ticket are expected here; any other FAIL (dev-local strings, entitlements, identifiers, unknown
      # Mach-O, archives, symlinks, qrtz-dash-net) fails the job.
      - name: verify-bundle (everything but Developer ID / notarization)
        run: |
          set +e
          bash scripts/release/verify-bundle.sh "${{ steps.bundle.outputs.app }}" > vb.log 2>&1
          set -e
          cat vb.log
          grep 'verify-bundle: FAIL' vb.log \
            | grep -vE 'does not satisfy the launch requirement|codesign --verify --deep --strict failed|FAIL: spctl:|FAIL: stapler validate' \
            > unexpected.log || true
          {
            echo "### verify-bundle (unsigned build)"
            echo '```'; cat vb.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q 'no dev-local override strings' vb.log || { echo "dev-local scan did not run" >&2; exit 1; }
          # ADR 0237: six executables in Contents/MacOS (qrtz-app, qrtz, qrtz-echo, qrtz-nano, qrtz-ctrl, qrtz-snap).
          for x in qrtz-app qrtz qrtz-echo qrtz-nano qrtz-ctrl qrtz-snap; do
            [ -x "${{ steps.bundle.outputs.app }}/Contents/MacOS/$x" ] || { echo "missing Contents/MacOS/$x" >&2; exit 1; }
          done
          if [ -s unexpected.log ]; then echo "unexpected verify-bundle failures:" >&2; cat unexpected.log >&2; exit 1; fi
          echo "only the Developer ID / notarization checks failed (expected for an unsigned build)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qrtz-unsigned-macos-${{ github.sha }}
          path: |
            ${{ steps.bundle.outputs.app }}
            ${{ steps.bundle.outputs.dir }}/dmg/*.dmg
          retention-days: 14

  # Bozniak pre-public checklist: on a push to main, flag every commit that touches .github/**.
  workflow-changes:
    name: flag .github changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: commits touching .github/**
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          hits="$(git log --format='%h %an: %s' "$range" -- .github)"
          {
            echo "### .github/** changes in this push"
            if [ -n "$hits" ]; then
              echo ":warning: These commits touch .github/** and need a Bozniak review:"
              while IFS= read -r c; do echo "- $c"; git show --name-only --format= "${c%% *}" -- .github | sed 's/^/  - /'; done <<<"$hits"
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$hits" ] || echo "::warning::$(wc -l <<<"$hits" | tr -d ' ') commit(s) in this push touch .github/**"
