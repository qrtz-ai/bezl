# The daily timestamp re-sign (ADR 0153 §3, ADR 0162, ADR 0179): the timestamp is signed for 7 days and clients
# refuse it after 8, so this re-signs the live index's timestamp every day at 16:00 UTC (09:00 PDT / 08:00 PST)
# and uploads only the timestamp pair. It holds only the timestamp key (never the index key or a root key) and runs
# on Linux: nothing here needs a Mac. The Mac launchd job (scripts/modules/timestamp-job.sh) can stay as a backup:
# it skips itself when its output dir is behind the live index.
name: modules-timestamp

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: modules-publish # never while a module release is publishing
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: the timestamp secrets are set
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.s.outputs.ok }}
    steps:
      - id: s
        env:
          HAVE: ${{ secrets.QRTZ_TIMESTAMP_KEY != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          echo "ok=$HAVE" >>"$GITHUB_OUTPUT"
          [[ "$HAVE" == true ]] || echo "::warning::QRTZ_TIMESTAMP_KEY / R2 secrets aren't set (scripts/ci/setup-secrets.sh); the Mac launchd job is still the re-sign"

  timestamp:
    name: re-sign + upload v1/timestamp.json
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: paths
        run: echo "QRTZ_PUBLISH_OUT=$RUNNER_TEMP/qrtz-publish-out" >>"$GITHUB_ENV"
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: modules-timestamp
      - name: rclone
        run: |
          sudo apt-get install -y -q rclone >/dev/null
          rclone version | head -1
      - name: build qrtz-publish
        run: cargo build --release -p qrtz-publish
      - name: the timestamp key (0600 temp file)
        env:
          QRTZ_TIMESTAMP_KEY: ${{ secrets.QRTZ_TIMESTAMP_KEY }}
        run: bash scripts/ci/macos-signing.sh keys
      - name: the live store
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/hydrate-out.sh "$QRTZ_PUBLISH_OUT"
      - name: publish.sh --timestamp
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          export QRTZ_PUBLISH_BIN="$PWD/target/release/qrtz-publish"
          bash scripts/modules/publish.sh --timestamp
      - name: the live timestamp is the one just signed
        run: |
          export QRTZ_PUBLISH_BIN="$PWD/target/release/qrtz-publish"
          bash scripts/ci/verify-live.sh "$QRTZ_PUBLISH_OUT" --timestamp-only
      - name: remove the key
        if: always()
        run: bash scripts/ci/macos-signing.sh cleanup
