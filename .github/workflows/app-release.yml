# qrtz.app releases (ADR 0181, docs/release.md "qrtz.app releases"). Replaces release.yml (v* tags, unsigned).
#
# A push to main whose apps/desktop/src-tauri/tauri.conf.json version went up (scripts/app/version.mjs bump), or a
# workflow_dispatch, builds qrtz.app with echo bundled (ADR 0174), signs it (Developer ID, MR26CCZ496), notarizes and
# staples the app and the .dmg, and uploads the dmg as an Actions artifact. When the app-update key is set up (the
# APP_UPDATE_KEY secret and the committed crates/qrtz-app/src/app_update_key.pub, scripts/ci/setup-secrets.sh
# app-update) it also signs the update archive, checks that signature against the committed public key, uploads to R2
# (immutable versioned files under v1/app/<version>/, then qrtz-latest.dmg and latest.json with a 60 s cache), checks
# what modules.qrtz.ai serves, and tags `app-v<version>`. Without the key it stops after the artifact (a warning, not a
# failure): nothing goes to modules.qrtz.ai, and no tag.
name: app-release

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/tauri.conf.json'
  workflow_dispatch:

# One qrtz.app release at a time, never cancelled midway (latest.json goes up last).
concurrency:
  group: app-release
  cancel-in-progress: false

permissions:
  contents: write # the app-v<version> tag

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  plan:
    name: a new qrtz version?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: version, bump and secrets
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HAVE_SIGNING: >-
            ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' &&
                (secrets.AC_APP_PASSWORD != '' || secrets.AC_API_KEY != '') }}
          HAVE_UPDATE_KEY: ${{ secrets.APP_UPDATE_KEY != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          v="$(node scripts/app/version.mjs current)"
          echo "version=$v" >>"$GITHUB_OUTPUT"
          go=1
          if [[ "$EVENT" == push ]]; then
            old=""
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE:$conf" 2>/dev/null; then
              old="$(git show "$BEFORE:$conf" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
            fi
            if [[ "$old" == "$v" || -z "$old" ]]; then
              echo "tauri.conf.json is still $v (was ${old:-unknown}): not a version bump"
              go=0
            fi
          fi
          if git rev-parse -q --verify "refs/tags/app-v$v" >/dev/null; then
            echo "::notice::app-v$v is already released; bump the version (scripts/app/version.mjs bump)"
            [[ "$EVENT" == push ]] && go=0
          fi
          if [[ "$HAVE_SIGNING" != true ]]; then
            echo "::warning::the Developer ID and notarization secrets aren't set (scripts/ci/setup-secrets.sh cert notary)"
            go=0
          fi
          publish=0
          if [[ "$HAVE_UPDATE_KEY" == true ]] && node scripts/app/feed.mjs --check-key crates/qrtz-app/src/app_update_key.pub; then
            publish=1
          else
            echo "::warning::no app-update key yet (scripts/ci/setup-secrets.sh app-update): the dmg is built and notarized, nothing is published"
          fi
          if git rev-parse -q --verify "refs/tags/app-v$v" >/dev/null; then publish=0; fi
          echo "go=$go" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "qrtz $v: go=$go publish=$publish"

  release:
    name: build · sign · notarize · staple${{ needs.plan.outputs.publish == '1' && ' · update archive · upload · tag' || '' }}
    needs: plan
    if: needs.plan.outputs.go == '1'
    runs-on: macos-latest # macOS 26, arm64
    timeout-minutes: 120
    env:
      QRTZ_TEAM_ID: MR26CCZ496
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      SWIFT_BUILD_FLAGS: --disable-keychain
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: native/qrtz-helper/.build
          key: swiftpm-release-${{ runner.os }}-${{ hashFiles('native/qrtz-helper/Package.swift', 'native/qrtz-helper/Package.resolved') }}
          restore-keys: swiftpm-release-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: tools
        run: |
          swift --version
          if [[ "$PUBLISH" == 1 ]]; then brew install rclone minisign >/dev/null; rclone version | head -1; fi

      - name: Developer ID and notarization (temporary keychain)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: bash scripts/ci/macos-signing.sh setup-identity

      - name: build, sign, notarize and staple (sign-notarize.sh, echo bundled)
        env:
          CI: 'true'
          # Speech module source, baked in at compile time (docs/release.md). Unset = a build without speech.
          QRTZ_SPEECH_URL: ${{ secrets.QRTZ_SPEECH_URL }}
          QRTZ_SPEECH_KEY_ID: ${{ secrets.QRTZ_SPEECH_KEY_ID }}
          QRTZ_SPEECH_KEY: ${{ secrets.QRTZ_SPEECH_KEY }}
          QRTZ_SPEECH_ROOT_KEY_ID: ${{ secrets.QRTZ_SPEECH_ROOT_KEY_ID }}
          QRTZ_SPEECH_ROOT_KEY: ${{ secrets.QRTZ_SPEECH_ROOT_KEY }}
        run: bash scripts/release/sign-notarize.sh

      - name: the bundle is qrtz ${{ needs.plan.outputs.version }} with echo
        id: art
        run: |
          app="$PWD/target/release/bundle/macos/qrtz.app"
          [[ -d "$app" ]] || app="$PWD/apps/desktop/src-tauri/target/release/bundle/macos/qrtz.app"
          dmg="$(dirname "$app")/qrtz_${VERSION}_aarch64.dmg"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == ai.qrtz.desktop ]]
          [[ -x "$app/Contents/MacOS/qrtz-echo" ]] || { echo "::error::qrtz-echo isn't bundled (ADR 0174)"; exit 1; }
          codesign -dv "$app/Contents/MacOS/qrtz-echo" 2>&1 | grep -qx 'Identifier=ai.qrtz.echo'
          codesign --verify --strict -R='anchor apple generic and identifier "ai.qrtz.echo" and certificate leaf[subject.OU] = "MR26CCZ496"' "$app/Contents/MacOS/qrtz-echo"
          codesign --verify --deep --strict -R='anchor apple generic and identifier "ai.qrtz.desktop" and certificate leaf[subject.OU] = "MR26CCZ496" and notarized' "$app"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$dmg" "$dmg.sha256" "$RUNNER_TEMP/dist/"
          echo "app=$app" >>"$GITHUB_OUTPUT"
          echo "dmg=$dmg" >>"$GITHUB_OUTPUT"

      - name: the notarized dmg (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: qrtz-${{ needs.plan.outputs.version }}-macos-aarch64-dmg
          path: ${{ runner.temp }}/dist/
          retention-days: 30
          if-no-files-found: error

      - name: the update archive, signed with the app-update key
        if: env.PUBLISH == '1'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.APP_UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APP: ${{ steps.art.outputs.app }}
        run: |
          out="$RUNNER_TEMP/app-update"
          mkdir -p "$out"
          tgz="$out/qrtz_${VERSION}_aarch64.app.tar.gz"
          # COPYFILE_DISABLE: no ._ AppleDouble files (they would break the bundle's seal when unpacked).
          COPYFILE_DISABLE=1 tar -C "$(dirname "$APP")" -czf "$tgz" qrtz.app
          # The signature's trusted comment carries the version; the app requires it to match the feed's.
          node_modules/.bin/tauri signer sign --app-version "$VERSION" "$tgz" >/dev/null
          [[ -s "$tgz.sig" ]] || { echo "::error::no signature written"; exit 1; }
          # It verifies against the public key the app has compiled in (a key mismatch fails here, not on Macs).
          pub="$(grep -v '^#' crates/qrtz-app/src/app_update_key.pub | tr -d '[:space:]')"
          printf '%s' "$pub" | base64 --decode >"$out/k.pub"
          base64 --decode -i "$tgz.sig" >"$out/k.sig"
          minisign -V -p "$out/k.pub" -x "$out/k.sig" -m "$tgz"
          grep -q "version:$VERSION" "$out/k.sig"
          rm -f "$out/k.pub" "$out/k.sig"
          bun scripts/release-notes.mjs "$VERSION" >"$out/notes.md" 2>/dev/null || : >"$out/notes.md"
          node scripts/app/feed.mjs --version "$VERSION" --archive "$tgz" --sig "$tgz.sig" --notes-file "$out/notes.md" >"$out/latest.json"
          cat "$out/latest.json"

      - name: upload to modules.qrtz.ai (R2 v1/app/)
        if: env.PUBLISH == '1'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DMG: ${{ steps.art.outputs.dmg }}
        run: bash scripts/app/upload.sh "$RUNNER_TEMP/app-update" "$DMG"

      - name: what modules.qrtz.ai serves is what was signed
        if: env.PUBLISH == '1'
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: bash scripts/app/verify-live.sh "$RUNNER_TEMP/app-update" "$DMG"

      - name: tag app-v${{ needs.plan.outputs.version }}
        if: env.PUBLISH == '1'
        run: |
          git config user.name 'qrtz-release[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/app/version.mjs tag --push

      - name: remove the keychain and every secret file
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/app-update"
          bash scripts/ci/macos-signing.sh cleanup
