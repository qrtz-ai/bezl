# Releases on GitHub (QRT-297; docs/modules/production-setup.md "Releases on GitHub"). Replaces the Cloudflare R2
# upload: qrtz.app and every package are hosted on GitHub Releases, and the signed package index (root, index,
# timestamp and every package blob, content-addressed) lives as flat assets on the fixed `index` release, which the
# app reads through https://github.com/qrtz-ai/qrtz/releases/download/index/<asset> (never api.github.com).
#
#   tag v<x.y.z>             qrtz.app (tauri.conf.json must say x.y.z)
#   tag <module>-v<x.y.z>    one package: nano, ctrl or snap (modules/<module>/qrtz.json must say x.y.z)
#   workflow_dispatch        tag=<one of the above> re-runs that release; tag=timestamp re-signs the timestamp;
#                            tag=feed-refresh re-signs qrtz.app's update feed with a new 30-day expiry
#   schedule (daily)         the timestamp re-sign (clients refuse a timestamp older than 8 days)
#
# Guard rails (Bozniak, QRT-297):
#   - `build` compiles with no secret and a read-only token. Nothing it produces is trusted beyond "these bytes":
#     `sign` re-signs every executable inside out, notarizes, and checks team, identifier and requirement itself.
#   - `sign` runs in the `release` environment (Jared is its required reviewer; deployments only from tags and main)
#     and only when the tag's commit is on main. It is the one job with `contents: write`.
#   - `timestamp` holds only the timestamp key, in the separate `release-timestamp` environment.
#   - Every action is pinned to a full commit SHA. No pull_request_target. Secrets reach only the step that needs
#     them, through env; nothing is printed.
name: release

on:
  push:
    tags: ['v*', 'nano-v*', 'ctrl-v*', 'snap-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'v<x.y.z>, <module>-v<x.y.z>, timestamp or feed-refresh'
        required: true
  schedule:
    - cron: '0 16 * * *'

# One publish at a time, never cancelled midway (the timestamp and latest.json go up last).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  QRTZ_TEAM_ID: MR26CCZ496

jobs:
  plan:
    name: what to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.p.outputs.kind }}
      tag: ${{ steps.p.outputs.tag }}
      sha: ${{ steps.p.outputs.sha }}
      version: ${{ steps.p.outputs.version }}
      module: ${{ steps.p.outputs.module }}
      on_main: ${{ steps.p.outputs.on_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >>"$GITHUB_OUTPUT"; echo "plan: $1=$2"; }
          case "$EVENT" in
            schedule) tag=timestamp ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) tag="$REF_NAME" ;;
          esac
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::not a tag name: $tag"; exit 1; }
          out tag "$tag"
          git fetch -q origin main
          case "$tag" in
            timestamp | feed-refresh)
              out kind "$tag"
              out sha "$(git rev-parse origin/main)"
              out on_main true
              exit 0
              ;;
            v[0-9]*)
              v="${tag#v}"; kind=app; m="" ;;
            nano-v[0-9]* | ctrl-v[0-9]* | snap-v[0-9]*)
              m="${tag%%-v*}"; v="${tag#*-v}"; kind=pkg ;;
            *) echo "::error::$tag: not v<x.y.z> or <nano|ctrl|snap>-v<x.y.z>"; exit 1 ;;
          esac
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag: not a plain x.y.z version"; exit 1; }
          sha="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" || { echo "::error::no tag $tag"; exit 1; }
          if [[ "$kind" == app ]]; then
            got="$(git show "$sha:apps/desktop/src-tauri/tauri.conf.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          else
            got="$(git show "$sha:modules/$m/qrtz.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          fi
          [[ "$got" == "$v" ]] || { echo "::error::$tag: the tagged commit says version $got"; exit 1; }
          on_main=false
          git merge-base --is-ancestor "$sha" origin/main && on_main=true
          [[ "$on_main" == true ]] || echo "::warning::$tag ($sha) isn't on main: it is built, never signed or published"
          out kind "$kind"
          out sha "$sha"
          out version "$v"
          out module "$m"
          out on_main "$on_main"

  # Job A: compile with no secret and a read-only token.
  build:
    name: build ${{ needs.plan.outputs.tag }} (no secrets)
    needs: plan
    if: needs.plan.outputs.kind == 'app' || needs.plan.outputs.kind == 'pkg'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SWIFT_BUILD_FLAGS: --disable-keychain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - run: bun install --frozen-lockfile
      - name: qrtz.app, unsigned (the same build release:mac does, no identity)
        if: needs.plan.outputs.kind == 'app'
        run: |
          env -u APPLE_SIGNING_IDENTITY -u APPLE_CERTIFICATE -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID \
            -u APPLE_API_KEY -u APPLE_API_ISSUER -u APPLE_API_KEY_PATH bun run --cwd apps/desktop make
          app="$(find target apps/desktop/src-tauri/target -path '*/release/bundle/macos/qrtz.app' -maxdepth 5 -type d 2>/dev/null | head -n1)"
          [[ -d "$app" ]] || { echo "::error::no qrtz.app"; exit 1; }
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ "$v" == "${{ needs.plan.outputs.version }}" ]] || { echo "::error::built $v"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist"
          # tar keeps the bundle's symlinks and modes (an artifact zip doesn't).
          tar -C "$(dirname "$app")" -cf "$RUNNER_TEMP/dist/qrtz.app.tar" qrtz.app
      - name: the package, unsigned (ad-hoc), and qrtz-publish
        if: needs.plan.outputs.kind == 'pkg'
        env:
          MODULE: ${{ needs.plan.outputs.module }}
        run: |
          QRTZ_SIGN_ID=- bash scripts/modules/build-packages.sh --out "$RUNNER_TEMP/pkgs" "$MODULE"
          cargo build --release -p qrtz-publish
          mkdir -p "$RUNNER_TEMP/dist"
          tar -C "$RUNNER_TEMP/pkgs" -cf "$RUNNER_TEMP/dist/packages.tar" packages
          cp "${CARGO_TARGET_DIR:-target}/release/qrtz-publish" "$RUNNER_TEMP/dist/qrtz-publish"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/dist/
          retention-days: 7
          if-no-files-found: error

  # Job B: sign, notarize, publish. Jared approves each run (environment `release`).
  sign:
    name: sign · notarize · publish ${{ needs.plan.outputs.tag }}
    needs: [plan, build]
    if: needs.plan.outputs.on_main == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      MODULE: ${{ needs.plan.outputs.module }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # The tauri CLI (update signatures) and the scripts' node deps; no install scripts run in this job.
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/unsigned
      - name: tools
        run: brew install minisign >/dev/null && gh --version | head -1

      - name: Developer ID, notarization and index keys (temporary keychain, 0600 files)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          QRTZ_INDEX_KEY: ${{ secrets.QRTZ_INDEX_KEY }}
          QRTZ_TIMESTAMP_KEY: ${{ secrets.QRTZ_TIMESTAMP_KEY }}
          KIND: ${{ needs.plan.outputs.kind }}
        run: |
          if [[ "$KIND" == pkg ]]; then bash scripts/ci/macos-signing.sh setup; else bash scripts/ci/macos-signing.sh setup-identity; fi

      # ---- qrtz.app ----
      - name: sign, notarize and staple qrtz.app (sign-notarize.sh --app)
        if: needs.plan.outputs.kind == 'app'
        id: app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -C "$RUNNER_TEMP/app" -xf "$RUNNER_TEMP/unsigned/qrtz.app.tar"
          app="$RUNNER_TEMP/app/qrtz.app"
          CI=true bash scripts/release/sign-notarize.sh --app "$app"
          dmg="$RUNNER_TEMP/app/qrtz_${VERSION}_aarch64.dmg"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == ai.qrtz.desktop ]]
          [[ -x "$app/Contents/MacOS/qrtz-echo" ]] || { echo "::error::qrtz-echo isn't bundled (ADR 0174)"; exit 1; }
          codesign --verify --strict -R='anchor apple generic and identifier "ai.qrtz.echo" and certificate leaf[subject.OU] = "MR26CCZ496"' "$app/Contents/MacOS/qrtz-echo"
          codesign --verify --deep --strict -R='anchor apple generic and identifier "ai.qrtz.desktop" and certificate leaf[subject.OU] = "MR26CCZ496" and notarized' "$app"
          [[ -s "$dmg" ]] || { echo "::error::no $dmg"; exit 1; }
          echo "app=$app" >>"$GITHUB_OUTPUT"
          echo "dmg=$dmg" >>"$GITHUB_OUTPUT"
      - name: the update archive and feed, signed with the update key
        if: needs.plan.outputs.kind == 'app'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP: ${{ steps.app.outputs.app }}
        run: |
          node scripts/app/feed.mjs --check-key crates/qrtz-app/src/app_update_key.pub ||
            { echo "::error::crates/qrtz-app/src/app_update_key.pub holds no update key"; exit 1; }
          out="$RUNNER_TEMP/app-update"
          mkdir -p "$out"
          tgz="$out/qrtz_${VERSION}_aarch64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -C "$(dirname "$APP")" -czf "$tgz" qrtz.app
          node_modules/.bin/tauri signer sign --app-version "$VERSION" "$tgz" >/dev/null
          [[ -s "$tgz.sig" ]] || { echo "::error::no signature written"; exit 1; }
          # It verifies against the public key the app has compiled in (a key mismatch fails here, not on Macs).
          grep -v '^#' crates/qrtz-app/src/app_update_key.pub | tr -d '[:space:]' | base64 --decode >"$out/k.pub"
          base64 --decode -i "$tgz.sig" >"$out/k.sig"
          minisign -V -p "$out/k.pub" -x "$out/k.sig" -m "$tgz"
          grep -q "version:$VERSION" "$out/k.sig"
          rm -f "$out/k.pub" "$out/k.sig"
          bun scripts/release-notes.mjs "$VERSION" >"$out/notes.md" 2>/dev/null || : >"$out/notes.md"
          node scripts/app/feed.mjs --version "$VERSION" --archive "$tgz" --sig "$tgz.sig" --notes-file "$out/notes.md" \
            --expires-days 30 >"$out/feed.json"
          bash scripts/app/sign-feed.sh "$out/feed.json" "$out/latest.json"
          rm -f "$out/feed.json"
      - name: publish qrtz.app (the v<x.y.z> release, then the update on the index release, latest.json last)
        if: needs.plan.outputs.kind == 'app'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.app.outputs.dmg }}
        run: |
          out="$RUNNER_TEMP/app-update"
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" >"$out/$(basename "$DMG").sha256")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "qrtz $VERSION" --notes-file "$out/notes.md" >/dev/null
          fi
          gh release upload "$TAG" "$DMG" "$out/$(basename "$DMG").sha256" --clobber
          bash scripts/release/gh-store.sh upload-app "$out" "$DMG"
          bash scripts/app/verify-live.sh "$out" "$DMG"

      # ---- one package ----
      - name: sign, notarize and publish ${{ needs.plan.outputs.module }} (index release, timestamp last)
        if: needs.plan.outputs.kind == 'pkg'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkgs="$RUNNER_TEMP/pkgs"
          mkdir -p "$pkgs"
          tar -C "$pkgs" -xf "$RUNNER_TEMP/unsigned/packages.tar"
          export QRTZ_PUBLISH_BIN="$RUNNER_TEMP/unsigned/qrtz-publish"
          chmod 755 "$QRTZ_PUBLISH_BIN"
          bash scripts/modules/build-packages.sh --out "$pkgs" --sign-only "$MODULE"
          export QRTZ_PUBLISH_OUT="$RUNNER_TEMP/qrtz-publish-out"
          export QRTZ_PUBLISH_PACKAGES="$pkgs/packages/$MODULE"
          export QRTZ_MODEL_CACHE="$RUNNER_TEMP/qrtz-publish-models"
          QRTZ_PUBLISH_MODELS="$(grep -o '"model\.[a-z0-9-]*"' "$pkgs/packages/$MODULE/qrtz.json" | tr -d '"' | sort -u | tr '\n' ' ')"
          export QRTZ_PUBLISH_MODELS
          bash scripts/modules/publish.sh
          bash scripts/ci/verify-live.sh "$QRTZ_PUBLISH_OUT"
          tar -C "$pkgs/packages" -czf "$RUNNER_TEMP/$TAG.tar.gz" "$MODULE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest=false --title "$MODULE $VERSION" \
              --notes "Signed and notarized $MODULE $VERSION. qrtz installs it from the signed index; this copy is for reference." >/dev/null
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/$TAG.tar.gz" --clobber

      - name: remove the keychain and every secret file
        if: always()
        run: bash scripts/ci/macos-signing.sh cleanup

  # The daily re-sign: only the timestamp key, in its own environment.
  timestamp:
    name: re-sign the index timestamp
    needs: plan
    if: needs.plan.outputs.kind == 'timestamp'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-timestamp
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: build qrtz-publish
        run: cargo build --release -p qrtz-publish
      - name: the timestamp key (0600 temp file)
        env:
          QRTZ_TIMESTAMP_KEY: ${{ secrets.QRTZ_TIMESTAMP_KEY }}
        run: bash scripts/ci/macos-signing.sh keys
      - name: publish.sh --timestamp (re-hydrates from the index release, uploads only the timestamp pair)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export QRTZ_PUBLISH_BIN="$PWD/target/release/qrtz-publish" QRTZ_PUBLISH_OUT="$RUNNER_TEMP/qrtz-publish-out"
          bash scripts/modules/publish.sh --timestamp
          bash scripts/ci/verify-live.sh "$QRTZ_PUBLISH_OUT" --timestamp-only
      - name: remove the key
        if: always()
        run: bash scripts/ci/macos-signing.sh cleanup

  # qrtz.app's update feed expires 30 days after it was signed: re-sign it (unchanged but the expiry) on demand.
  feed-refresh:
    name: re-sign qrtz.app's update feed
    needs: plan
    if: needs.plan.outputs.kind == 'feed-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      HOST: https://github.com/${{ github.repository }}/releases/download/index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: tools
        run: |
          bun install --frozen-lockfile --ignore-scripts
          sudo apt-get install -y -qq minisign >/dev/null
      - name: the live feed is ours
        run: |
          d="$RUNNER_TEMP/f"
          mkdir -p "$d"
          curl -fsSL -o "$d/live.json" "$HOST/v1.app.latest.json"
          node -e 'const fs=require("fs"),e=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],Buffer.from(e.feed,"base64"));fs.writeFileSync(process.argv[3],Buffer.from(e.signature,"base64"))' \
            "$d/live.json" "$d/live-feed.json" "$d/live.sig"
          grep -v '^#' crates/qrtz-app/src/app_update_key.pub | tr -d '[:space:]' | base64 --decode >"$d/k.pub"
          minisign -V -p "$d/k.pub" -x "$d/live.sig" -m "$d/live-feed.json"
      - name: re-sign with a new expires
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          d="$RUNNER_TEMP/f"
          node scripts/app/feed.mjs --unwrap "$d/live.json" --expires-days 30 >"$d/feed.json"
          bash scripts/app/sign-feed.sh "$d/feed.json" "$d/latest.json"
      - name: upload and check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/f"
          bash scripts/release/gh-store.sh upload-feed "$d/latest.json"
          want="$(sha256sum "$d/latest.json" | cut -d' ' -f1)"
          for i in $(seq 1 20); do
            got="$(curl -fsSL "$HOST/v1.app.latest.json" | sha256sum | cut -d' ' -f1)"
            [[ "$got" == "$want" ]] && { echo "feed-refresh: live"; exit 0; }
            sleep 15
          done
          echo "::error::$HOST/v1.app.latest.json isn't the re-signed feed"
          exit 1
