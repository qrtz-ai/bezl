# Module releases (ADR 0179, docs/release.md "Module releases in CI"): a push to main that changes a module's code or
# manifest bumps that module's patch version, builds, signs (Developer ID), notarizes, signs the index and timestamp,
# uploads to modules.qrtz.ai (R2) and tags `<module>-v<version>`, all through `scripts/modules/publish.sh --release`
# (the same one command as on the release Mac). Secrets: scripts/ci/setup-secrets.sh. Never a root key.
name: modules-release

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'native/qrtz-helper/Package.swift'
      - 'native/qrtz-helper/Package.resolved'
      - 'native/qrtz-helper/Sources/**'
      - 'native/qrtz-helper/entitlements/**'
      - 'crates/qrtz-modules/**'
      - 'tools/qrtz-publish/**'
      - 'crates/qrtz-app/src/local_models.json'
      - 'crates/qrtz-app/src/ctrl_laya_model.json'
      - 'scripts/modules/publish.sh'
      - 'scripts/modules/build-packages.sh'
      - 'scripts/modules/version.mjs'
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'bump every module (nano, ctrl, snap) even with no changes'
        type: boolean
        default: false

# One publish at a time, never cancelled midway (a half-done upload is recovered by the next run, but two runs would
# race for the next index/timestamp version). Shared with modules-timestamp.yml.
concurrency:
  group: modules-publish
  cancel-in-progress: false

permissions:
  contents: write # the version-bump commit and the <module>-v<version> tags

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  plan:
    name: anything to release?
    # Loop guard: the bump commit publish.sh pushes ("modules: release …", with GITHUB_TOKEN, which never triggers a
    # workflow anyway) and anything marked [skip ci] don't start a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       !startsWith(github.event.head_commit.message, 'modules: release '))
    runs-on: ubuntu-24.04 # cheap: the Mac only starts when there is something to publish
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      force: ${{ steps.plan.outputs.force }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: the versioning entry point is on main
        run: |
          grep -q -- '--release) release=1' scripts/modules/publish.sh && [[ -f scripts/modules/version.mjs ]] || {
            echo "::error::scripts/modules/publish.sh has no --release (module versioning) yet; nothing published"
            exit 1
          }
      - name: the release secrets are set (scripts/ci/setup-secrets.sh)
        id: secrets
        env:
          HAVE: >-
            ${{ secrets.MACOS_CERT_P12 != '' && secrets.QRTZ_INDEX_KEY != '' && secrets.QRTZ_TIMESTAMP_KEY != '' &&
                secrets.R2_SECRET_ACCESS_KEY != '' && (secrets.AC_APP_PASSWORD != '' || secrets.AC_API_KEY != '') }}
        run: |
          echo "ok=$HAVE" >>"$GITHUB_OUTPUT"
          [[ "$HAVE" == true ]] || echo "::warning::release secrets aren't set yet: run scripts/ci/setup-secrets.sh on the release Mac. Nothing published."
      # bump / pending → go; an unchanged module with a release forces a bump of all three (publish.sh --release
      # republishes every package, and a rebuilt binary never matches the live one); live-but-untagged → error.
      - name: version.mjs plan + the live index
        id: plan
        if: steps.secrets.outputs.ok == 'true'
        run: bash scripts/ci/release-plan.sh ${{ inputs.force_bump && '--force' || '' }}

  release:
    name: bump · build · notarize · sign · upload · tag
    needs: plan
    if: needs.plan.outputs.go == '1'
    runs-on: macos-latest # macOS 26, arm64
    timeout-minutes: 120
    env:
      QRTZ_TEAM_ID: MR26CCZ496
      SWIFT_BUILD_FLAGS: --disable-keychain
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # publish.sh --release runs on the main branch, at origin/main
          fetch-depth: 0 # every commit and <module>-v* tag: version.mjs diffs against the last tag
          fetch-tags: true
      - name: git identity (the bump commit and tags) and paths
        run: |
          git config user.name 'qrtz-release[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            echo "QRTZ_PUBLISH_OUT=$RUNNER_TEMP/qrtz-publish-out"
            echo "QRTZ_PACKAGES_OUT=$RUNNER_TEMP/qrtz-packages"
            echo "QRTZ_MODEL_CACHE=$HOME/qrtz-publish-models"
            echo "QRTZ_MODELS_DIR=$RUNNER_TEMP/no-app-models" # never created: no app copy here, hash from the cache
          } >>"$GITHUB_ENV"
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: modules-macos
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: native/qrtz-helper/.build
          key: swiftpm-release-${{ runner.os }}-${{ hashFiles('native/qrtz-helper/Package.swift', 'native/qrtz-helper/Package.resolved') }}
          restore-keys: swiftpm-release-${{ runner.os }}-
      - name: model cache (only to hash the pinned sets; never uploaded, ADR 0171)
        uses: actions/cache@v6
        with:
          path: ~/qrtz-publish-models
          key: models-${{ hashFiles('crates/qrtz-app/src/local_models.json', 'crates/qrtz-app/src/ctrl_laya_model.json') }}
          restore-keys: models-
      - name: tools
        run: |
          brew install rclone >/dev/null
          swift --version
          rclone version | head -1

      - name: signing, notarization and index keys (temporary keychain, 0600 files)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          QRTZ_INDEX_KEY: ${{ secrets.QRTZ_INDEX_KEY }}
          QRTZ_TIMESTAMP_KEY: ${{ secrets.QRTZ_TIMESTAMP_KEY }}
        run: bash scripts/ci/macos-signing.sh setup

      - name: the live store (the output dir continues from what modules.qrtz.ai serves)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci/hydrate-out.sh "$QRTZ_PUBLISH_OUT"

      - name: publish.sh --release (bump + push, build, notarize, sign, upload, tag + push)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FORCE_BUMP: ${{ needs.plan.outputs.force == '1' && '--force-bump' || '' }}
        run: bash scripts/modules/publish.sh --release $FORCE_BUMP

      - name: the live index serves exactly what was signed
        run: |
          export QRTZ_PUBLISH_BIN="${CARGO_TARGET_DIR:-$PWD/target}/release/qrtz-publish"
          bash scripts/ci/verify-live.sh "$QRTZ_PUBLISH_OUT"
          git log --oneline -1
          git tag --points-at HEAD

      - name: remove the keychain and every secret file
        if: always()
        run: bash scripts/ci/macos-signing.sh cleanup
