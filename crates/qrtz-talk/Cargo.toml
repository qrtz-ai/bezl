[package]
name = "qrtz-talk"
description = "qrtz talk (push-to-talk dictation) for the Tauri build: on-device speech through the helper, rules cleanup, insertion, history. No network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrtz-speech = { path = "../qrtz-speech" }
qrtz-ipc = { path = "../qrtz-ipc" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
fancy-regex = "0.16"

[dev-dependencies]
# The test helper admits dictation/recording through the shared helper arbiter (spec/vectors/helper).
qrtz-lifecycle.workspace = true
qrtz-model.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }
tempfile.workspace = true
base64 = "0.22"
# ADR 0112: tests read the `talk latency` line.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }
