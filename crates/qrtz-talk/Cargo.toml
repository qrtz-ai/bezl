[package]
name = "qrtz-talk"
description = "qrtz talk (push-to-talk dictation) for the Tauri build: cloud streaming ASR behind StreamingProvider (qrtz Nemotron server, ElevenLabs Scribe v2 Realtime), mic capture through the helper, cleanup, insertion, history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["net"]
# The production WebSocket transport (tokio-tungstenite over rustls). Tests use in-process mocks or a local server.
net = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
qrtz-speech = { path = "../qrtz-speech" }
qrtz-ipc = { path = "../qrtz-ipc" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
fancy-regex = "0.16"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
], optional = true }

[dev-dependencies]
# The test helper admits dictation/recording through the shared helper arbiter (spec/vectors/helper).
qrtz-lifecycle.workspace = true
qrtz-model.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }
tempfile.workspace = true
