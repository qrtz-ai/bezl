[package]
name = "qrtz-speech"
description = "qrtz speech (ADR 0046): the model-agnostic speech protocol and its untrusted-output validator, the SpeechEngine trait, and the module manager (Ed25519-signed bundles with a pinned, rotatable key, resumable size-limited downloads, staging + rename into read-only versions/<v>, atomic pointer, anti-rollback + signed denylist, health check, crash-loop rollback, N and N-1 kept)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrtz-cloexec = { path = "../qrtz-cloexec" }
qrtz-speech-types = { path = "../qrtz-speech-types" }
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = [
  "net",
  "io-util",
  "process",
  "time",
  "sync",
  "rt",
] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
semver = "1"
# ADR 0078: the one network client in qrtz, only with the `net` feature (qrtz-app's speech updates).
reqwest = { version = "0.12", default-features = false, optional = true, features = [
  "rustls-tls",
  "stream",
] }
futures-util = { version = "0.3", optional = true }
libc = "0.2"

[features]
# `testkit`: signing toolkit + bundle server for tests (this crate's and qrtz-app's E2E).
testkit = []
# `net`: the signed module download and update channel (`download`, `update`; reqwest). ADR 0078: only qrtz-app
# enables it, so qrtz-talk and qrtz-lifecycle build with no HTTP client.
net = ["dep:reqwest", "dep:futures-util"]

[dev-dependencies]
qrtz-speech = { path = ".", features = ["testkit", "net"] }
tempfile.workspace = true
ed25519-dalek = "2"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
] }
