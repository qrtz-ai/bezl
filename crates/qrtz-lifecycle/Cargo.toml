[package]
name = "qrtz-lifecycle"
description = "The qrtz recording lifecycle: pure session reducer, post-processing pipeline and retry policies (port of packages/core/src/note/lifecycle.ts)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The recording runtime (NoteService port): async, persists through qrtz-storage.
runtime = [
  "dep:tokio",
  "dep:async-trait",
  "dep:serde_json",
  "dep:qrtz-storage",
  "dep:tracing",
  "dep:thiserror",
  "dep:qrtz-speech-types",
]

[dependencies]
qrtz-model = { workspace = true }
serde = { workspace = true }
indexmap = { workspace = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
qrtz-storage = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
# ADR 0046: the runtime consumes `SpeechEvent` (helper asr lines are going away). ADR 0146 M2: from the shared
# types crate, not the shell's qrtz-speech.
qrtz-speech-types = { workspace = true, optional = true }

[dev-dependencies]
qrtz-speech = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
qrtz-storage = { workspace = true }
rusqlite = { workspace = true }
# Scenario op `helperInvalid`: the production helper-line parser (contract schema).
qrtz-helper-bridge = { workspace = true }
# hardening27: the meeting's capture record against the IPC contract (`note:pipeline`).
qrtz-ipc = { workspace = true }
# `cargo test --workspace` builds the runtime tests without extra flags.
qrtz-lifecycle = { path = ".", features = ["runtime"] }
