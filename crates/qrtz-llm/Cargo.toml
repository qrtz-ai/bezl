[package]
name = "qrtz-llm"
description = "qrtz meeting summaries, on-device only: the summary prompt and reply parser, the extractive summary and the meeting loader for qrtz-app's SummarySteps. No network (ADR 0076)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrtz-model.workspace = true
qrtz-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
regex = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
] }
