[package]
name = "qrtz-ctrl"
description = "qrtz ctrl core: \"ctrl do\", a chain of small calibrated decisions over the macOS accessibility tree, the host-owned confirm gate and the append-only, text-free event log (ADR 0215). UI-free, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile.workspace = true

[features]
# The Laya (Core ML) scorer for the decision chain (ADR 0106, kept by ADR 0215). macOS only, and only used with a
# consented, installed model and a runtime; without it (and everywhere else) the deterministic heuristic answers.
laya = []
