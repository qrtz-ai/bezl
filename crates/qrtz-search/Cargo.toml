[package]
name = "qrtz-search"
description = "qrtz semantic search: the Embedder seam (FTS only until a model is loaded), the index step with its deadline, the bounded/cancelable vector backfill, chat retrieval and the lexical + hybrid ranker (port of packages/core/src/note/{chat,embeddings}.ts and the worker's note.stepIndex / note.chat retrieval)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrtz-model.workspace = true
qrtz-storage.workspace = true
qrtz-lifecycle = { workspace = true, features = ["runtime"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
regex = "1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
# minilm: the local all-MiniLM-L6-v2 embedder (ADR 0050). Weights are not bundled; they come from a model
# directory (the app's model store), or `minilm-download` fetches the pinned revision and checks its hashes.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.21", default-features = false, features = [
  "fancy-regex",
], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["minilm"]
minilm = [
  "dep:candle-core",
  "dep:candle-nn",
  "dep:candle-transformers",
  "dep:tokenizers",
  "dep:sha2",
]
minilm-download = ["minilm", "dep:reqwest", "tokio/fs"]

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
  "test-util",
] }
