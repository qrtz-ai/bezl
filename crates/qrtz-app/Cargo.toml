[package]
name = "qrtz-app"
description = "UI-free app service for the Tauri build: IPC routing to runtime/storage/talk ports, config, secrets, helper wiring, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `NoteRuntimePort`: the qrtz-lifecycle `NoteRuntime` behind `RuntimePort` (note:delete so far).
runtime = [
  "dep:qrtz-lifecycle",
  "dep:qrtz-storage",
  "dep:qrtz-model",
  "dep:qrtz-backup",
  "dep:qrtz-llm",
  "dep:qrtz-talk",
  "dep:qrtz-speech",
]

# ADR 0157 §9, ADR 0162: the package manager's command line, shipped inside qrtz.app as Contents/MacOS/qrtz (an
# externalBin built by `bun run build:helper`; the app's own executable is Contents/MacOS/qrtz-app).
[[bin]]
name = "qrtz"
path = "src/bin/qrtz.rs"
required-features = ["runtime"]

[dependencies]
qrtz-lifecycle = { workspace = true, features = ["runtime"], optional = true }
qrtz-storage = { workspace = true, optional = true }
qrtz-model = { workspace = true, optional = true }
qrtz-backup = { workspace = true, optional = true }
qrtz-llm = { workspace = true, optional = true }
qrtz-talk = { workspace = true, optional = true }
# ADR 0078: the only crate that enables `net` (the signed speech module download / update channel).
qrtz-speech = { workspace = true, optional = true, features = ["net"] }
rand = { workspace = true }
unicode-normalization = { workspace = true }
qrtz-ipc = { workspace = true }
# ADR 0146: module manifests, lockfile and the global module switches (pure Rust, no network).
qrtz-modules = { workspace = true }
# ADR 0161: the marketplace catalog picks dependency versions the way the resolver does.
semver = { workspace = true }
qrtz-helper-bridge = { workspace = true }
# ctrl (ADR 0100, 0103): the task store and run logs behind the `ctrl:*` channels. Pure Rust, no network.
qrtz-ctrl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# ADR 0083: the local log (stderr + the rotating file under ~/Library/Logs/qrtz); already the shell's subscriber.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "registry",
  "std",
  # tauri, wry and tao log through the `log` facade; their warnings and errors reach the same sinks.
  "tracing-log",
] }
minisign-verify = "0.3.0"
base64 = { workspace = true }

# ADR 0181: the self-update download and stage dirs; RENAME_SWAP's errno.
tempfile = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# ADR 0078: only to delete Keychain items an older build saved (qrtz stores no keys).
security-framework = "3"
# ADR 0185 (E1): the running echo's signing information (SecCodeCopySigningInformation's dictionary).
core-foundation = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
qrtz-helper-bridge = { workspace = true }
qrtz-storage = { workspace = true }
libc = { workspace = true }
qrtz-speech = { workspace = true, features = ["testkit", "net"] }
ed25519-dalek = { workspace = true }
qrtz-publish = { workspace = true }
# `cargo test --workspace` builds the runtime adapter tests without extra flags.
qrtz-app = { path = ".", features = ["runtime"] }
