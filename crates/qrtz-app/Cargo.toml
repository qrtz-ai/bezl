[package]
name = "qrtz-app"
description = "UI-free app service for the Tauri build: IPC routing to runtime/storage/talk ports, config, secrets, helper wiring, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `NoteRuntimePort`: the qrtz-lifecycle `NoteRuntime` behind `RuntimePort` (note:delete so far).
runtime = [
  "dep:qrtz-lifecycle",
  "dep:qrtz-storage",
  "dep:qrtz-model",
  "dep:qrtz-backup",
  "dep:qrtz-llm",
  "dep:qrtz-talk",
  "dep:qrtz-speech",
]

# ADR 0157 §9: the package manager's command line, shipped inside qrtz.app (Contents/MacOS/qrtz).
[[bin]]
name = "qrtz"
path = "src/bin/qrtz.rs"
required-features = ["runtime"]

[dependencies]
qrtz-lifecycle = { workspace = true, features = ["runtime"], optional = true }
qrtz-storage = { workspace = true, optional = true }
qrtz-model = { workspace = true, optional = true }
qrtz-backup = { workspace = true, optional = true }
qrtz-llm = { path = "../qrtz-llm", optional = true }
qrtz-talk = { path = "../qrtz-talk", optional = true }
# ADR 0078: the only crate that enables `net` (the signed speech module download / update channel).
qrtz-speech = { path = "../qrtz-speech", optional = true, features = ["net"] }
rand.workspace = true
unicode-normalization.workspace = true
qrtz-ipc = { path = "../qrtz-ipc" }
# ADR 0146: module manifests, lockfile and the global module switches (pure Rust, no network).
qrtz-modules = { path = "../qrtz-modules" }
qrtz-helper-bridge = { path = "../qrtz-helper-bridge" }
# ctrl (ADR 0100, 0103): the task store and run logs behind the `ctrl:*` channels. Pure Rust, no network.
qrtz-ctrl = { path = "../qrtz-ctrl" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
# ADR 0083: the local log (stderr + the rotating file under ~/Library/Logs/qrtz); already the shell's subscriber.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "registry",
  "std",
  # tauri, wry and tao log through the `log` facade; their warnings and errors reach the same sinks.
  "tracing-log",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# ADR 0078: only to delete Keychain items an older build saved (qrtz stores no keys).
security-framework = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
qrtz-helper-bridge = { path = "../qrtz-helper-bridge" }
qrtz-storage.workspace = true
libc = "0.2"
qrtz-speech = { path = "../qrtz-speech", features = ["testkit", "net"] }
ed25519-dalek = "2"
qrtz-publish = { path = "../../tools/qrtz-publish" }
# `cargo test --workspace` builds the runtime adapter tests without extra flags.
qrtz-app = { path = ".", features = ["runtime"] }
