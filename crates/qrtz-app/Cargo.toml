[package]
name = "qrtz-app"
description = "UI-free app service for the Tauri build: IPC routing to runtime/storage/talk ports, config, secrets, helper wiring, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `NoteRuntimePort`: the qrtz-lifecycle `NoteRuntime` behind `RuntimePort` (note:delete so far).
runtime = [
  "dep:qrtz-lifecycle",
  "dep:qrtz-storage",
  "dep:qrtz-model",
  "dep:qrtz-backup",
  "dep:qrtz-llm",
  "dep:qrtz-search",
  "dep:qrtz-talk",
  "dep:qrtz-speech",
  "dep:reqwest",
]

[dependencies]
qrtz-lifecycle = { workspace = true, features = ["runtime"], optional = true }
qrtz-storage = { workspace = true, optional = true }
qrtz-model = { workspace = true, optional = true }
qrtz-backup = { workspace = true, optional = true }
qrtz-llm = { path = "../qrtz-llm", optional = true }
qrtz-search = { path = "../qrtz-search", optional = true, features = [
  "minilm-download",
] }
qrtz-talk = { path = "../qrtz-talk", optional = true }
# The search model download (Hugging Face redirects to its CDN; https only).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
], optional = true }
qrtz-speech = { path = "../qrtz-speech", optional = true }
rand.workspace = true
unicode-normalization.workspace = true
qrtz-ipc = { path = "../qrtz-ipc" }
qrtz-helper-bridge = { path = "../qrtz-helper-bridge" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
qrtz-helper-bridge = { path = "../qrtz-helper-bridge" }
qrtz-storage.workspace = true
qrtz-search = { path = "../qrtz-search" }
libc = "0.2"
qrtz-speech = { path = "../qrtz-speech", features = ["testkit"] }
ed25519-dalek = "2"
# e2e_notes_privacy.rs reads the log (`meeting ignored (excluded app)`), as the Electron spec read logs/main.jsonl.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
] }
# `cargo test --workspace` builds the runtime adapter tests without extra flags.
qrtz-app = { path = ".", features = ["runtime"] }
