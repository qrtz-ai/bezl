[package]
name = "qrtz-dash-net"
description = "Agent Dash's network helper (ADR 0231 amendment 1): a separate process that talks only to https://dash.qrtz.ai, and to the app only over stdio dash.read/dash.manage messages. The only crate with a network role in docs/modules/confinement-map.json."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qrtz-dash-net"
path = "src/main.rs"

[features]
# Debug builds only (docs/dash-local.md, FOR BOZNIAK REVIEW): lets QRTZ_DASH_ORIGIN point the helper at
# http://127.0.0.1:<port> (local wrangler dev). Compiled out of release builds whatever the features. Never default.
dev-local = []

[dependencies]
serde_json = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
qrtz-ipc = { workspace = true }
# The one network library (ADR 0231 amendment 1): the same reqwest and features qrtz-speech already uses.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# OSX_10_15: the data-protection keychain (Bozniak M6).
security-framework = { version = "3", features = ["OSX_10_15"] }
# QRT-286: CFDate/CFString for the legacy sweep's creation-date match (already in the tree via security-framework).
core-foundation = "0.10"

[dev-dependencies]
qrtz-dash = { workspace = true }

[lints]
workspace = true
