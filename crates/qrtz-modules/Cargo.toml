[package]
name = "qrtz-modules"
description = "qrtz modules (ADR 0144): the module manifest with exact-pinned dependencies (id, exact version, sha256, team id + designated requirement), the local lockfile (no ranges, no network resolution), the sideload revocation rules, the launcher plan, the XPC service admission and per-connection state, and per-module + global settings. Pure Rust, no network, no I/O beyond the lockfile and settings files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
semver = "1"

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
