[package]
name = "qrtz-modules"
description = "qrtz modules (ADR 0144): the module manifest with exact-pinned dependencies (id, exact version, sha256, team id + designated requirement), the local lockfile (no ranges, no network resolution), the sideload revocation rules, the launcher plan, the XPC service admission and per-connection state, and per-module + global settings; the signed module index (root/timestamp/index), the .qrtzpkg sideload file and the installer (ADR 0153). No network code: the installer takes its bytes through a Transport trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
ed25519-dalek = { workspace = true }
async-trait = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# N193 L1: the store/.tmp sweep works relative to one O_NOFOLLOW directory fd (already in the tree via tempfile).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
jsonschema = { workspace = true }

[lints]
workspace = true
