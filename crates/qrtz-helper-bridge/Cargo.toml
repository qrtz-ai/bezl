[package]
name = "qrtz-helper-bridge"
description = "Spawns and supervises the Swift qrtz-helper as a child process over its unchanged JSON-lines stdio protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrtz-cloexec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[[bin]]
name = "qrtz-mock-helper"
path = "src/bin/qrtz-mock-helper.rs"
test = false

[lints]
workspace = true
