# Rust side of the Electron → Tauri 2 migration (docs/tauri-migration.md).
# crates/* are UI-free; apps/desktop/src-tauri is the thin Tauri shell.
# Ownership: qrtz-storage and qrtz-lifecycle belong to the core-crates track; qrtz-ipc,
# qrtz-helper-bridge, qrtz-app and the shell belong to the shell track.
[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "tools/*"]

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.59", default-features = false }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "process",
  "io-util",
  "fs",
] }
async-trait = "0.1"
tracing = "0.1"
rand = "0.9"
tempfile = "3"
# core-crates track (qrtz-model, qrtz-lifecycle, qrtz-storage)
qrtz-model = { path = "crates/qrtz-model" }
qrtz-lifecycle = { path = "crates/qrtz-lifecycle" }
qrtz-storage = { path = "crates/qrtz-storage" }
qrtz-backup = { path = "crates/qrtz-backup" }
# shared versions: one pin per crate, every member uses { workspace = true }
sha2 = "0.10"
hex = "0.4"
semver = "1"
regex = "1"
libc = "0.2"
ed25519-dalek = "2"
base64 = "0.22"
# internal crates
qrtz-app = { path = "crates/qrtz-app" }
qrtz-cloexec = { path = "crates/qrtz-cloexec" }
qrtz-ctrl = { path = "crates/qrtz-ctrl" }
qrtz-helper-bridge = { path = "crates/qrtz-helper-bridge" }
qrtz-ipc = { path = "crates/qrtz-ipc" }
qrtz-llm = { path = "crates/qrtz-llm" }
qrtz-modules = { path = "crates/qrtz-modules" }
qrtz-publish = { path = "tools/qrtz-publish" }
qrtz-speech = { path = "crates/qrtz-speech" }
qrtz-speech-types = { path = "crates/qrtz-speech-types" }
qrtz-talk = { path = "crates/qrtz-talk" }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-normalization = "0.1"
indexmap = "2"
# rc.22 = the tauri-specta 2.0.0-rc.21 line; rc.25 needs rustc >= 1.93 (fmt::from_fn).
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
# strip off: true corrupts release binaries on Jared's Mac with the current Xcode.
strip = false
